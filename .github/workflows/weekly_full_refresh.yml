name: Weekly full price refresh

on:
  # Paused: this job deletes and reloads each returned ticker's full history.
  # Keep manual dispatch available until it has validation, provenance
  # preservation, and a dry-run mode (DATA_LESSONS / ISSUES).
  workflow_dispatch: {}

jobs:
  full_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run full refresh
        run: python ingest_update.py --mode full_refresh --full-refresh-years 3

      - name: Rebuild events (vol_event)
        run: python build_events.py

      - name: Summary
        if: always()
        run: echo "Full refresh finished with status ${{ job.status }}"
