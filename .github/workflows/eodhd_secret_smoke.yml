name: EODHD secret smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Call EODHD with the repository secret
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          python - <<'PY'
          from eodhd_client import EODHDClient

          limits = EODHDClient().get_user_limits()
          # Never emit the token or a request URL. The secret is only passed
          # to the client process through GitHub Actions' masked environment.
          print("EODHD user endpoint succeeded")
          print("dailyRateLimit:", limits.get("dailyRateLimit", "unknown"))
          PY
